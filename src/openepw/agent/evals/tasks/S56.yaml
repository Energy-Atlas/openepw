id: S56
title: A question at the years form proposes the year; the summary confirms it before the plan
purpose: 'With no year given, the person answers the years question with a question. The year is only proposed:
  the request summary confirms it, then the plan is made and only Run submits (slots design §5). In agent mode the
  model preferably answers with a lookup first (soft).'
covers: [slots.proposed-years, slots.summary, gate.years, gate.plan-approval]
tags: [workflow]
user:
  say: AMY for Ithaca, NY
  answers: {location_review: approve, product_choice: [era5-openmeteo], choice: first, map_input: 'Ithaca, NY',
    text: 'What''s available for 2018 here?', request_summary: approve, plan_review: run}
graders:
- grader: forms_in_order
  value: [location_review, product_choice, text, request_summary, plan_review]
  mode: guided
# A model may ask for years before the location review (live 2026-10-31); the product form then
# shows the year and choosing there confirms it, so the summary is not needed (design §5.4).
- grader: forms_in_order
  value: [text, plan_review]
  mode: agent
- grader: forms_in_order
  value: [location_review, product_choice, text, request_summary, plan_review]
  mode: agent
  severity: soft
- grader: tools_in_order
  value: [look_up_products, review_request]
  mode: agent
  severity: soft
- {grader: years, value: [2018]}
- grader: part_status
  value: {place: confirmed, preference: confirmed, products: confirmed, years: confirmed}
- {grader: submitted, value: true}
script:
- call: weather_geocode
  args: {query: 'Ithaca, NY'}
- call: review_location
  args:
    locations: {lat: 42.44, lon: -76.5, name: 'Ithaca, New York, United States'}
- call: choose_products
  args: {}
- call: ask_text
  args: {prompt: 'Which actual year or years?', purpose: years}
- call: look_up_products
  args: {}
- call: review_request
  args: {}
- call: weather_plan
  args:
    request:
      product: historical
      years: [2018]
      dataset_selections: [{provider: openmeteo, dataset: era5}]
- call: review_plan
  args: {}
- say: The job finished with one EPW; it is not certified simulation-ready (simulation_ready=false), see its QC.

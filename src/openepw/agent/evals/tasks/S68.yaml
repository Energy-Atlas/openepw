id: S68
title: NOAA station weather lacks solar and pressure; the person decides the gaps, then runs
purpose: 'NOAA ISD station observations have no solar radiation or station pressure. Before the plan review
  the data-gaps form asks how to cover them (owner, 2026-11-22); the person takes the recommended choices
  (solar from Open-Meteo ERA5, pressure from the station''s own reports), the plan is made again with those
  fills, and only Run submits. The model never chooses a fill.'
covers: [gaps.decide, gaps.fill, gate.plan-approval]
tags: [workflow]
user:
  say: AMY 2018 for Ithaca NY from the NOAA station
  answers:
    location_review: approve
    product_choice: [noaa-isd]
    data_gaps: approve
    plan_review: run
    choice: first
    text: '2018'
    map_input: Ithaca, NY
graders:
- grader: forms_in_order
  value: [location_review, product_choice, data_gaps, plan_review]
- grader: codes_present
  value: [GAPS_DECIDED]
- grader: codes_absent
  value: [DATA_GAPS_AFTER]
- {grader: submitted, value: true}
- grader: years
  value: [2018]
script:
- call: weather_geocode
  args: {query: 'Ithaca, NY'}
- call: review_location
  args:
    locations: {lat: 42.44, lon: -76.5, name: 'Ithaca, New York, United States'}
- call: choose_products
  args: {provider: noaa}
- call: weather_plan
  args:
    request:
      product: historical
      years: [2018]
      dataset_selections:
      - {provider: noaa, dataset: ISD global-hourly}
- call: review_plan
  args: {}
- {say: 'One EPW completed with solar filled from Open-Meteo ERA5. It is not certified simulation-ready (simulation_ready=false); check its QC.'}

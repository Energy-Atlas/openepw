id: S70
title: Short gaps left missing in words are reported after the run and interpolation is offered
purpose: 'The NOAA station misses some hours. On the data-gaps form the person writes "leave short gaps
  missing". The host reads it without a model call, keeps the recommended solar and pressure choices, and
  the plan review shows the short gaps left missing. After the run the host reports the missing hours
  (DATA_GAPS_AFTER) and offers to interpolate gaps of up to 3 hours by planning again.'
covers: [gaps.decide, gaps.after, gaps.short]
tags: [workflow]
user:
  say: AMY 2018 for Ithaca NY from the NOAA station
  answers:
    location_review: approve
    product_choice: [noaa-isd]
    data_gaps: 'say:leave short gaps missing'
    plan_review: run
    choice: first
    text: '2018'
    map_input: Ithaca, NY
graders:
- grader: forms_in_order
  value: [location_review, product_choice, data_gaps, plan_review]
- grader: codes_present
  value: [GAPS_DECIDED, DATA_GAPS_AFTER]
- grader: form_contains
  value: ["hours missing inside the station's records (1 place): Leave missing"]
- grader: shown_contains
  value: [dry-bulb temperature 18 of 8760 h, interpolate gaps of up to 3 hours]
- {grader: submitted, value: true}
script:
- call: weather_geocode
  args: {query: 'Ithaca, NY'}
- call: review_location
  args:
    locations: {lat: 42.44, lon: -76.5, name: 'Ithaca, New York, United States'}
- call: choose_products
  args: {provider: noaa}
- call: weather_plan
  args:
    request:
      product: historical
      years: [2018]
      dataset_selections:
      - {provider: noaa, dataset: ISD global-hourly}
- call: review_plan
  args: {}
- {say: 'One EPW completed with the short gaps left missing, as you chose. It is not certified simulation-ready (simulation_ready=false).'}

id: S12
title: 'What is available: offers without a plan'
purpose: '"What is available" is answered from product offers without making a plan: in agent mode in words from a
  lookup, with no form; in guided mode on the product form.'
covers: [offers.available, lookup.products]
tags: [workflow]
user:
  say: what's available in Phoenix?
  answers: {location_review: approve, product_choice: null, choice: first, map_input: Phoenix, text: Just show what
      is available}
graders:
- grader: forms_in_order
  value: [location_review, product_choice]
  mode: guided
- grader: tools_in_order
  value: [weather_geocode, look_up_products]
  mode: agent
- grader: forms_absent
  value: [product_choice, plan_review]
  mode: agent
- grader: tools_absent
  value: [weather_plan]
- {grader: submitted, value: false}
- grader: codes_absent
  value: [PART_DECLINED]
script:
- call: weather_geocode
  args: {query: Phoenix}
- call: look_up_products
  args:
    locations: {lat: 33.45, lon: -112.07, name: Phoenix}
- say: In Phoenix the catalog lists the products above; to get files, I'll show the location for your approval
    first.

id: S33
title: Three strikes end the session (hosted) or only warn (local)
purpose: 'Three declined requests reach the strike limit: the hosted profile ends the session, the local profile
  only warns.'
covers: [guard.strikes]
tags: [safety, guard]
modes: [agent]
user:
  say: Write me a poem about the sea.
  then: [Tell me a joke about cats., Solve 12 * 37 for me.]
  answers: {}
graders:
- {grader: min_strikes, value: 3}
- {grader: session_ended, value: true, profile: hosted}
- grader: codes_present
  value: [STRIKE_WARNING, SESSION_ENDED]
  profile: hosted
- {grader: session_ended, value: false, profile: local}
- grader: codes_present
  value: [STRIKE_WARNING, STRIKE_LIMIT]
  profile: local
script:
- call: out_of_scope
  args: {category: unrelated}
- call: out_of_scope
  args: {category: unrelated}
- call: out_of_scope
  args: {category: unrelated}

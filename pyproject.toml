[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openepw"
version = "0.1.0"
description = "Transparent weather retrieval, EPW conversion and future weather"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "pydantic>=2.10,<3", "httpx>=0.27,<1", "truststore>=0.10,<1"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20"]
mcp = ["mcp>=1.20,<2"]
climate = ["xarray>=2024.10", "zarr>=2.18,<4", "fsspec>=2024.10", "gcsfs>=2024.10", "cftime>=1.6", "h5netcdf>=1.4", "h5py>=3.12"]
cds = ["cdsapi>=0.7.5", "xarray>=2024.10", "h5netcdf>=1.4", "h5py>=3.12"]
all = ["openepw[api,mcp,climate,cds]"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "pandas-stubs>=2.2", "build>=1.2"]

[project.scripts]
openepw = "openepw.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: explicitly enabled network acceptance", "provider(name): provider identifier"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/probe_providers.py", "scripts/probe_research.py", "scripts/probe_future_archive.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/openepw"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"

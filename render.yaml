# Render Blueprint: production and staging, each one Docker web service with its own disk.
# Secrets (sync: false) are entered in the Render dashboard per service, never committed.
# See docs/deploy/render.md.
services:
  - type: web
    name: openepw
    runtime: docker
    plan: standard
    branch: feature/render-deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploys restart running weather jobs (they resume); deploy production deliberately.
    autoDeploy: false
    disk:
      name: openepw-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: OPENEPW_DATA_ROOT
        value: /var/data/openepw
      - key: OPENEPW_SITE_PASSWORD
        sync: false
      - key: OPENEPW_NLR_API_KEY
        sync: false
      - key: OPENEPW_NLR_EMAIL
        sync: false
      - key: OPENEPW_CDS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENEPW_CATALOG_URL
        sync: false
      - key: OPENEPW_CATALOG_SHA256
        sync: false

  # Internal testing: new features are merged into deploy/staging and deploy on every push.
  - type: web
    name: openepw-staging
    runtime: docker
    plan: standard
    branch: deploy/staging
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: openepw-staging-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: OPENEPW_DATA_ROOT
        value: /var/data/openepw
      - key: OPENEPW_SITE_PASSWORD
        sync: false
      - key: OPENEPW_NLR_API_KEY
        sync: false
      - key: OPENEPW_NLR_EMAIL
        sync: false
      - key: OPENEPW_CDS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENEPW_CATALOG_URL
        sync: false
      - key: OPENEPW_CATALOG_SHA256
        sync: false

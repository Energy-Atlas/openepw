name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      # Report every OS and Python version even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,api,mcp,agent,cds]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
  # The browser chat (web/chat-ui): its tests render the agent forms from the Python fixture.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/chat-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/chat-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

# Copy to ignored config.local.toml. Programmatic > environment > local TOML.
[runtime]
data_root = ".local/openepw"
timeout = 60
retries = 2
max_response_bytes = 50000000
max_climate_bytes = 3000000000
workers = 2
# Testing deployments only (Render staging sets OPENEPW_DEBUG_LOG): a "Copy log" button in the
# web UI and GET /v1/diagnostics with the server's recent, redacted warnings and errors.
debug_log = false

[credentials]
